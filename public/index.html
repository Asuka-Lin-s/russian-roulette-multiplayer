<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯轮盘 - 赌场版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        
        /* 顶部状态栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-info .label { color: #888; font-size: 0.85rem; }
        .player-info .value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
        }
        .player-info .value.debt { color: #ff6b6b; }
        
        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-wage {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #000;
            font-weight: bold;
        }
        .btn-wage:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-loan {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            color: white;
        }
        
        .game-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        /* 登录界面 */
        .login-screen {
            max-width: 400px;
            margin: 30px auto;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        .btn-primary {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(145deg, #28a745, #20c997);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(145deg, #ff0000, #cc0000);
            color: white;
        }
        
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 游戏界面 */
        .game-screen { display: none; }
        
        .players-area {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .players-area { grid-template-columns: 1fr; }
        }
        
        .player-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .player-card.active {
            border-color: #4ecdc4;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
        }
        
        .player-card.dead {
            border-color: #ff0000;
            opacity: 0.6;
        }
        
        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 10px;
        }
        
        .player-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .player-coins { font-size: 0.9rem; color: #ffd700; }
        .player-bet { font-size: 0.8rem; color: #ff6b6b; margin-top: 3px; }
        
        .vs-area {
            text-align: center;
        }
        
        .vs-badge {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff0000;
        }
        
        .pot-display {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 8px;
        }
        
        /* 投注区 */
        .betting-area {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .betting-title {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .bet-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .bet-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #444;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .bet-btn:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }
        
        .bet-info {
            color: #aaa;
            font-size: 0.85rem;
        }
        
        /* 转轮 */
        .revolver-section {
            text-align: center;
            margin: 15px 0;
        }
        
        .cylinder-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 10px;
        }
        
        .cylinder {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            border: 4px solid #444;
            position: relative;
            margin: 10px auto;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease;
        }
        
        .cylinder.spinning {
            animation: spin 0.3s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .chamber {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #555;
            transition: all 0.3s ease;
        }
        
        .chamber.current {
            box-shadow: 0 0 15px #ff0000;
            border-color: #ff0000;
        }
        
        .chamber.fired { background: #333; border-color: #666; }
        .chamber.bullet { background: #ff0000; border-color: #ff4444; }
        
        .chamber:nth-child(1) { top: 6px; left: 50%; transform: translateX(-50%); }
        .chamber:nth-child(2) { top: 30px; right: 12px; }
        .chamber:nth-child(3) { bottom: 30px; right: 12px; }
        .chamber:nth-child(4) { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .chamber:nth-child(5) { bottom: 30px; left: 12px; }
        .chamber:nth-child(6) { top: 30px; left: 12px; }
        
        .center-pin {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #666;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* 消息区 */
        .message-area {
            min-height: 50px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-size: 1rem;
            border: 2px solid transparent;
        }
        
        .message-area.danger {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
            color: #ff6b6b;
        }
        
        .message-area.success {
            background: rgba(78, 205, 196, 0.2);
            border-color: rgba(78, 205, 196, 0.5);
            color: #4ecdc4;
        }
        
        /* 操作按钮 */
        .action-area {
            text-align: center;
            margin-top: 15px;
        }
        
        .action-title {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        
        .bullet-options {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .bullet-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #444;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .bullet-option.selected {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.3);
        }
        
        /* 错误提示 */
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔫 俄罗斯轮盘 · 赌场版</h1>
        <p class="subtitle">高风险高回报，赢家通吃！</p>
        
        <!-- 顶部状态栏 -->
        <div class="top-bar" id="topBar" style="display: none;">
            <div class="player-info">
                <span class="label">💰 金币:</span>
                <span class="value" id="playerCoins">200</span>
            </div>
            <div class="player-info">
                <span class="label">💸 借贷:</span>
                <span class="value debt" id="playerDebt">0</span>
            </div>
            <div class="player-info">
                <span class="label">📊 净资产:</span>
                <span class="value" id="playerNet">200</span>
            </div>
            <button class="btn-small btn-wage" id="wageBtn" onclick="claimWage()" disabled>领工资</button>
            <button class="btn-small btn-loan" onclick="takeLoan()">借贷</button>
        </div>

        <!-- 登录界面 -->
        <div class="login-screen" id="loginScreen">
            <div class="error-message" id="errorMessage"></div>
            
            <div class="input-group">
                <label>你的昵称</label>
                <input type="text" id="playerName" placeholder="输入昵称" maxlength="10" value="玩家">
            </div>

            <button class="btn btn-success" onclick="createRoom()">创建房间</button>
            
            <div style="margin: 15px 0; color: #666;">- 或 -</div>
            
            <div class="input-group">
                <label>房间号</label>
                <input type="text" id="roomId" placeholder="输入6位房间号" maxlength="6">
            </div>
            
            <button class="btn btn-primary" onclick="joinRoom()">加入房间</button>
        </div>

        <!-- 游戏界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="game-panel">
                <!-- 房间信息 -->
                <div style="text-align: center; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                    <span style="color: #888;">房间号: </span>
                    <span id="roomIdDisplay" style="font-size: 1.5rem; font-weight: bold; color: #4ecdc4; letter-spacing: 3px;">------</span>
                    <button class="btn-small btn-primary" onclick="copyRoomId()" style="margin-left: 10px;">复制</button>
                    <button class="btn-small" onclick="leaveRoom()" style="margin-left: 10px; background: #666;">退出房间</button>
                </div>
                
                <!-- 玩家区域 -->
                <div class="players-area">
                    <div class="player-card" id="playerCard">
                        <div class="player-avatar">🙂</div>
                        <div class="player-name">你</div>
                        <div class="player-coins" id="playerBetCoins">金币: 200</div>
                        <div class="player-bet" id="playerCurrentBet">投注: 0</div>
                    </div>

                    <div class="vs-area">
                        <div class="vs-badge">VS</div>
                        <div class="pot-display" id="potDisplay">💰 0</div>
                    </div>

                    <div class="player-card" id="enemyCard">
                        <div class="player-avatar">🤖</div>
                        <div class="player-name">对手</div>
                        <div class="player-coins" id="enemyBetCoins">金币: ???</div>
                        <div class="player-bet" id="enemyCurrentBet">投注: ???</div>
                    </div>
                </div>

                <!-- 投注区 -->
                <div class="betting-area" id="bettingArea">
                    <div class="betting-title">💎 点击按钮累加投注（底注1金币）</div>
                    <div class="bet-buttons">
                        <button class="bet-btn" onclick="placeBet(1)">1</button>
                        <button class="bet-btn" onclick="placeBet(5)">5</button>
                        <button class="bet-btn" onclick="placeBet(10)">10</button>
                        <button class="bet-btn" onclick="placeBet(20)">20</button>
                        <button class="bet-btn" onclick="placeBet(50)">50</button>
                        <button class="bet-btn" onclick="placeBet(100)">100</button>
                    </div>
                    <div class="bet-info" id="betInfo">当前投注: 0 | 总计: 1（含底注）</div>
                </div>

                <!-- 转轮 -->
                <div class="revolver-section">
                    <div class="cylinder-container">
                        <div class="cylinder" id="cylinder">
                            <div class="chamber" id="chamber-0"></div>
                            <div class="chamber" id="chamber-1"></div>
                            <div class="chamber" id="chamber-2"></div>
                            <div class="chamber" id="chamber-3"></div>
                            <div class="chamber" id="chamber-4"></div>
                            <div class="chamber" id="chamber-5"></div>
                            <div class="center-pin"></div>
                        </div>
                    </div>
                </div>

                <!-- 消息区 -->
                <div class="message-area" id="messageArea">等待玩家加入...</div>

                <!-- 操作区 -->
                <div class="action-area" id="actionArea">
                    <div class="action-title" id="actionTitle">选择你的行动</div>
                    
                    <!-- 子弹选择 -->
                    <div class="bullet-options" id="bulletOptions" style="display: none;">
                        <button class="bullet-option" onclick="selectBullet(1)">1</button>
                        <button class="bullet-option" onclick="selectBullet(2)">2</button>
                        <button class="bullet-option" onclick="selectBullet(3)">3</button>
                        <button class="bullet-option" onclick="selectBullet(4)">4</button>
                        <button class="bullet-option" onclick="selectBullet(5)">5</button>
                    </div>
                    
                    <!-- 主要按钮 -->
                    <div id="mainButtons">
                        <button class="btn btn-success" id="readyBtn" onclick="setReady()">✓ 准备（扣除底注）</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentRoomId = null;
        let currentPlayerId = null;
        let isHost = false;
        let gameState = null;
        let playerData = { coins: 200, debt: 0 };
        let selectedBulletCount = 1;
        let currentBet = 0;

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 3000);
        }

        function createRoom() {
            const playerName = document.getElementById('playerName').value.trim();
            if (!playerName) { showError('请输入昵称'); return; }
            
            connectWebSocket(() => {
                ws.send(JSON.stringify({ type: 'createRoom', playerName: playerName }));
            });
        }

        function joinRoom() {
            const playerName = document.getElementById('playerName').value.trim();
            const roomId = document.getElementById('roomId').value.trim().toUpperCase();
            if (!playerName) { showError('请输入昵称'); return; }
            if (!roomId) { showError('请输入房间号'); return; }
            
            connectWebSocket(() => {
                ws.send(JSON.stringify({ type: 'joinRoom', roomId: roomId, playerName: playerName }));
            });
        }

        function connectWebSocket(onOpen) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            console.log('Connecting to:', wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                onOpen();
            };
            
            ws.onmessage = (event) => {
                console.log('Received:', event.data);
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                showError('连接失败，请检查服务器是否运行');
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed');
                showError('连接已断开');
            };
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'roomCreated':
                    currentRoomId = data.data.roomId;
                    currentPlayerId = data.data.playerId;
                    isHost = true;
                    playerData = data.data.playerData;
                    showGameScreen();
                    break;
                    
                case 'roomJoined':
                    currentRoomId = data.data.roomId;
                    currentPlayerId = data.data.playerId;
                    isHost = false;
                    playerData = data.data.playerData;
                    showGameScreen();
                    break;
                    
                case 'gameState':
                    gameState = data.data;
                    const currentPlayer = gameState.players.find(p => p.id === currentPlayerId);
                    if (currentPlayer) {
                        isHost = currentPlayer.isHost;
                        playerData.coins = currentPlayer.coins;
                        playerData.debt = currentPlayer.debt;
                        currentBet = currentPlayer.currentBet || 0;
                    }
                    updateUI();
                    break;
                    
                case 'error':
                    showError(data.data.message);
                    break;
                    
                case 'wageClaimed':
                    playerData.coins = data.data.coins;
                    updateTopBar();
                    alert(data.data.message);
                    break;
                    
                case 'loanTaken':
                    playerData.coins = data.data.coins;
                    playerData.debt = data.data.debt;
                    updateTopBar();
                    alert(data.data.message);
                    break;
                    
                case 'betPlaced':
                    currentBet = data.data.totalBet;
                    updateBetInfo();
                    break;
            }
        }

        function showGameScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('topBar').style.display = 'flex';
            document.getElementById('roomIdDisplay').textContent = currentRoomId;
            updateTopBar();
        }

        function copyRoomId() {
            const roomId = document.getElementById('roomIdDisplay').textContent;
            if (roomId === '------') {
                alert('房间号未生成');
                return;
            }
            
            // 降级方案（更可靠）
            const input = document.createElement('input');
            input.value = roomId;
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            input.setSelectionRange(0, 99999); // 移动端兼容
            
            try {
                document.execCommand('copy');
                alert('房间号已复制: ' + roomId);
            } catch (err) {
                // 如果execCommand失败，尝试clipboard API
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(roomId).then(() => {
                        alert('房间号已复制: ' + roomId);
                    }).catch(() => {
                        alert('复制失败，请手动复制: ' + roomId);
                    });
                } else {
                    alert('复制失败，请手动复制: ' + roomId);
                }
            }
            
            document.body.removeChild(input);
        }

        function leaveRoom() {
            if (confirm('确定要退出房间吗？')) {
                if (ws) {
                    ws.close();
                }
                // 重置状态
                currentRoomId = null;
                currentPlayerId = null;
                isHost = false;
                gameState = null;
                currentBet = 0;
                
                // 显示登录界面
                document.getElementById('gameScreen').style.display = 'none';
                document.getElementById('topBar').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('roomIdDisplay').textContent = '------';
            }
        }

        function updateTopBar() {
            document.getElementById('playerCoins').textContent = playerData.coins;
            document.getElementById('playerDebt').textContent = playerData.debt;
            document.getElementById('playerNet').textContent = playerData.coins - Math.floor(playerData.debt * (13/9));
            
            // 工资按钮状态
            const wageBtn = document.getElementById('wageBtn');
            // 这里简化处理，实际需要服务器返回状态
        }

        function updateUI() {
            updateTopBar();
            updatePlayers();
            updateCylinder();
            updateMessage();
            updateActionButtons();
            updatePot();
        }

        function updatePlayers() {
            if (!gameState) return;
            
            const player = gameState.players.find(p => p.id === currentPlayerId);
            const enemy = gameState.players.find(p => p.id !== currentPlayerId);
            
            if (player) {
                document.getElementById('playerBetCoins').textContent = `金币: ${player.coins}`;
                document.getElementById('playerCurrentBet').textContent = `投注: ${player.currentBet || 0}`;
                document.getElementById('playerCard').classList.toggle('active', player.isCurrent);
                document.getElementById('playerCard').classList.toggle('dead', !player.isAlive);
            }
            
            if (enemy) {
                document.getElementById('enemyBetCoins').textContent = `金币: ${enemy.coins}`;
                document.getElementById('enemyCurrentBet').textContent = `投注: ${enemy.currentBet || 0}`;
                document.getElementById('enemyCard').classList.toggle('active', enemy.isCurrent);
                document.getElementById('enemyCard').classList.toggle('dead', !enemy.isAlive);
            }
        }

        function updatePot() {
            if (gameState) {
                document.getElementById('potDisplay').textContent = `💰 ${gameState.pot || 0}`;
            }
        }

        function updateCylinder() {
            if (!gameState) return;
            const rotation = gameState.currentChamber * 60;
            document.getElementById('cylinder').style.transform = `rotate(${rotation}deg)`;
            
            for (let i = 0; i < 6; i++) {
                const chamber = document.getElementById(`chamber-${i}`);
                chamber.classList.remove('active', 'fired', 'bullet');
                if (i === gameState.currentChamber) chamber.classList.add('active');
            }
        }

        function updateMessage() {
            if (gameState) {
                document.getElementById('messageArea').textContent = gameState.message;
            }
        }

        function updateActionButtons() {
            if (!gameState) return;
            
            const buttonsDiv = document.getElementById('mainButtons');
            const bulletOptions = document.getElementById('bulletOptions');
            const bettingArea = document.getElementById('bettingArea');
            
            // 重置显示
            bulletOptions.style.display = 'none';
            bettingArea.style.display = 'none';
            
            switch(gameState.phase) {
                case 'waiting':
                case 'betting':
                    bettingArea.style.display = 'block';
                    updateBetInfo();
                    buttonsDiv.innerHTML = '<button class="btn btn-success" id="readyBtn" onclick="setReady()">✓ 准备（扣除底注）</button>';
                    break;
                    
                case 'ready':
                    if (isHost) {
                        bulletOptions.style.display = 'flex';
                        buttonsDiv.innerHTML = `<button class="btn btn-primary" onclick="startGame()">开始游戏 (${selectedBulletCount}发子弹)</button>`;
                    } else {
                        buttonsDiv.innerHTML = '<button class="btn" disabled>等待房主开始...</button>';
                    }
                    break;
                    
                case 'playing':
                    const player = gameState.players.find(p => p.id === currentPlayerId);
                    if (player?.isCurrent && player?.isAlive) {
                        buttonsDiv.innerHTML = '<button class="btn btn-danger" onclick="fire()">🔫 扣动扳机</button>';
                    } else if (!player?.isAlive) {
                        buttonsDiv.innerHTML = '<button class="btn" disabled>你已死亡</button>';
                    } else {
                        buttonsDiv.innerHTML = '<button class="btn" disabled>等待...</button>';
                    }
                    break;
                    
                case 'ended':
                    const winner = gameState.players.find(p => p.isAlive);
                    const isWinner = winner && winner.id === currentPlayerId;
                    
                    if (isWinner) {
                        buttonsDiv.innerHTML = '<button class="btn btn-primary" onclick="nextGame()">🏆 开始下一局</button>';
                    } else {
                        buttonsDiv.innerHTML = '<button class="btn" disabled>等待赢家...</button>';
                    }
                    break;
            }
        }

        function updateBetInfo() {
            const total = 1 + currentBet;
            document.getElementById('betInfo').textContent = `当前投注: ${currentBet} | 总计: ${total}（含底注1）`;
        }

        function placeBet(amount) {
            if (!ws) return;
            ws.send(JSON.stringify({ type: 'placeBet', amount: amount }));
        }

        function selectBullet(count) {
            selectedBulletCount = count;
            document.querySelectorAll('.bullet-option').forEach((btn, idx) => {
                btn.classList.toggle('selected', idx + 1 === count);
            });
        }

        function setReady() {
            if (!ws) return;
            ws.send(JSON.stringify({ type: 'ready' }));
        }

        function startGame() {
            if (!ws) return;
            ws.send(JSON.stringify({ type: 'startGame', bulletCount: selectedBulletCount }));
        }

        function fire() {
            if (!ws) return;
            document.getElementById('cylinder').classList.add('spinning');
            setTimeout(() => {
                document.getElementById('cylinder').classList.remove('spinning');
                ws.send(JSON.stringify({ type: 'fire' }));
            }, 500);
        }

        function nextGame() {
            if (!ws) return;
            ws.send(JSON.stringify({ type: 'nextGame' }));
        }

        function claimWage() {
            if (!ws) return;
            ws.send(JSON.stringify({ type: 'claimWage' }));
        }

        function takeLoan() {
            if (!ws) return;
            if (confirm('确定要借贷吗？\n借900金币，需还1300金币\n每次胜利将扣除35%用于还款')) {
                ws.send(JSON.stringify({ type: 'takeLoan' }));
            }
        }

        // 初始化
        selectBullet(1);
    </script>
</body>
</html>
