<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯轮盘 - 赌场版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        
        /* 登录界面 */
        .login-screen {
            max-width: 400px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .login-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #ffd700;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(145deg, #28a745, #20c997);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .error-message.show { display: block; }
        
        .success-message {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid rgba(78, 205, 196, 0.5);
            color: #4ecdc4;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
        
        .success-message.show { display: block; }
        
        /* 资产显示 */
        .assets-display {
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .assets-title {
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .assets-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .assets-detail {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .assets-detail .item {
            color: #aaa;
        }
        
        .assets-detail .item span {
            color: #fff;
            font-weight: bold;
        }
        
        .assets-detail .item.debt span {
            color: #ff6b6b;
        }
        
        /* 大厅界面 */
        .lobby-screen {
            display: none;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 15px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-name {
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .btn-small {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-wage {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #000;
            font-weight: bold;
        }
        
        .btn-wage:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-loan {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            color: white;
        }
        
        .btn-logout {
            background: #666;
            color: white;
        }
        
        .game-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .section-title {
            color: #888;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .room-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .room-input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 3px;
        }
        
        /* 游戏界面 */
        .game-screen {
            display: none;
        }
        
        .room-info {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        
        .room-id-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ecdc4;
            letter-spacing: 3px;
        }
        
        .players-area {
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .players-area { grid-template-columns: 1fr; }
        }
        
        .player-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .player-card.active {
            border-color: #4ecdc4;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
        }
        
        .player-card.dead {
            border-color: #ff0000;
            opacity: 0.6;
        }
        
        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 10px;
        }
        
        .player-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        
        .player-coins {
            font-size: 0.9rem;
            color: #ffd700;
        }
        
        .player-bet {
            font-size: 0.8rem;
            color: #ff6b6b;
            margin-top: 3px;
        }
        
        .vs-area {
            text-align: center;
        }
        
        .vs-badge {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff0000;
        }
        
        .pot-display {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 8px;
        }
        
        .betting-area {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .betting-title {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .bet-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .bet-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #444;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .bet-btn:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }
        
        .bet-info {
            color: #aaa;
            font-size: 0.85rem;
        }
        
        .revolver-section {
            text-align: center;
            margin: 15px 0;
        }
        
        .cylinder-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 10px;
        }
        
        .cylinder {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            border: 4px solid #444;
            position: relative;
            margin: 10px auto;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease;
        }
        
        .cylinder.spinning {
            animation: spin 0.3s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .chamber {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #555;
            transition: all 0.3s ease;
        }
        
        .chamber.current {
            box-shadow: 0 0 15px #ff0000;
            border-color: #ff0000;
        }
        
        .chamber.fired { background: #333; border-color: #666; }
        .chamber.bullet { background: #ff0000; border-color: #ff4444; }
        
        .chamber:nth-child(1) { top: 6px; left: 50%; transform: translateX(-50%); }
        .chamber:nth-child(2) { top: 30px; right: 12px; }
        .chamber:nth-child(3) { bottom: 30px; right: 12px; }
        .chamber:nth-child(4) { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .chamber:nth-child(5) { bottom: 30px; left: 12px; }
        .chamber:nth-child(6) { top: 30px; left: 12px; }
        
        .center-pin {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #666;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .message-area {
            min-height: 50px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-size: 1rem;
            border: 2px solid transparent;
        }
        
        .message-area.danger {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
            color: #ff6b6b;
        }
        
        .message-area.success {
            background: rgba(78, 205, 196, 0.2);
            border-color: rgba(78, 205, 196, 0.5);
            color: #4ecdc4;
        }
        
        .action-area {
            text-align: center;
            margin-top: 15px;
        }
        
        .action-title {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        
        .bullet-options {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .bullet-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #444;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .bullet-option.selected {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔫 俄罗斯轮盘 · 赌场版</h1>
        <p class="subtitle">高风险高回报，赢家通吃！</p>
        
        <!-- 登录界面 -->
        <div class="login-screen" id="loginScreen">
            <div class="login-title">🎰 玩家登录</div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <div class="input-group">
                <label>昵称</label>
                <input type="text" id="loginName" placeholder="输入昵称" maxlength="10">
            </div>
            
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" maxlength="20">
            </div>
            
            <button class="btn btn-primary" onclick="login()">登录 / 注册</button>
        </div>
        
        <!-- 大厅界面 -->
        <div class="lobby-screen" id="lobbyScreen">
            <div class="top-bar">
                <div class="user-info">
                    <span class="user-name" id="lobbyUserName">玩家</span>
                </div>
                <div>
                    <button class="btn-small btn-wage" id="lobbyWageBtn" onclick="claimWage()" disabled>领工资</button>
                    <button class="btn-small btn-loan" onclick="takeLoan()">借贷</button>
                    <button class="btn-small btn-logout" onclick="logout()">退出</button>
                </div>
            </div>
            
            <!-- 资产显示 -->
            <div class="assets-display">
                <div class="assets-title">💰 我的资产</div>
                <div class="assets-value" id="totalAssets">200</div>
                <div class="assets-detail">
                    <div class="item">金币: <span id="lobbyCoins">200</span></div>
                    <div class="item debt">借贷: <span id="lobbyDebt">0</span></div>
                    <div class="item">净资产: <span id="lobbyNet">200</span></div>
                </div>
            </div>
            
            <div class="game-panel">
                <div class="section-title">🏠 加入或创建房间</div>
                
                <div class="room-input-group">
                    <input type="text" id="roomIdInput" placeholder="输入房间号" maxlength="6">
                    <button class="btn btn-primary" onclick="joinRoom()" style="width: auto; padding: 12px 20px;">加入</button>
                </div>
                
                <div style="text-align: center; color: #666; margin: 10px 0;">- 或 -</div>
                
                <button class="btn btn-success" onclick="createRoom()">创建新房間</button>
            </div>
        </div>
        
        <!-- 游戏界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="top-bar">
                <div class="user-info">
                    <span class="user-name" id="gameUserName">玩家</span>
                    <span>💰 <span id="gameUserCoins">200</span></span>
                </div>
                <div>
                    <button class="btn-small btn-wage" id="gameWageBtn" onclick="claimWage()" disabled>领工资</button>
                    <button class="btn-small btn-loan" onclick="takeLoan()">借贷</button>
                    <button class="btn-small btn-logout" onclick="leaveRoom()">退出房间</button>
                </div>
            </div>
            
            <div class="game-panel">
                <div class="room-info">
                    <span style="color: #888;">房间号: </span>
                    <span class="room-id-display" id="roomIdDisplay">------</span>
                    <button class="btn-small btn-primary" onclick="copyRoomId()" style="margin-left: 10px;">复制</button>
                </div>
                
                <div class="players-area">
                    <div class="player-card" id="playerCard">
                        <div class="player-avatar">🙂</div>
                        <div class="player-name" id="playerNameDisplay">你</div>
                        <div class="player-coins" id="playerCoinsDisplay">金币: 200</div>
                        <div class="player-bet" id="playerBetDisplay">投注: 0</div>
                    </div>

                    <div class="vs-area">
                        <div class="vs-badge">VS</div>
                        <div class="pot-display" id="potDisplay">💰 0</div>
                    </div>

                    <div class="player-card" id="enemyCard">
                        <div class="player-avatar">🤖</div>
                        <div class="player-name" id="enemyNameDisplay">等待对手...</div>
                        <div class="player-coins" id="enemyCoinsDisplay">金币: ???</div>
                        <div class="player-bet" id="enemyBetDisplay">投注: ???</div>
                    </div>
                </div>

                <div class="betting-area" id="bettingArea">
                    <div class="betting-title">💎 点击按钮累加投注（底注1金币）</div>
                    <div class="bet-buttons">
                        <button class="bet-btn" onclick="placeBet(1)">1</button>
                        <button class="bet-btn" onclick="placeBet(5)">5</button>
                        <button class="bet-btn" onclick="placeBet(10)">10</button>
                        <button class="bet-btn" onclick="placeBet(20)">20</button>
                        <button class="bet-btn" onclick="placeBet(50)">50</button>
                        <button class="bet-btn" onclick="placeBet(100)">100</button>
                    </div>
                    <div class="bet-info" id="betInfo">当前投注: 0 | 总计: 1（含底注）</div>
                </div>

                <div class="revolver-section">
                    <div class="cylinder-container">
                        <div class="cylinder" id="cylinder">
                            <div class="chamber" id="chamber-0"></div>
                            <div class="chamber" id="chamber-1"></div>
                            <div class="chamber" id="chamber-2"></div>
                            <div class="chamber" id="chamber-3"></div>
                            <div class="chamber" id="chamber-4"></div>
                            <div class="chamber" id="chamber-5"></div>
                            <div class="center-pin"></div>
                        </div>
                    </div>
                </div>

                <div class="message-area" id="messageArea">等待玩家加入...</div>

                <div class="action-area" id="actionArea">
                    <div class="action-title" id="actionTitle">选择你的行动</div>
                    
                    <div class="bullet-options" id="bulletOptions" style="display: none;">
                        <button class="bullet-option" onclick="selectBullet(1)">1</button>
                        <button class="bullet-option" onclick="selectBullet(2)">2</button>
                        <button class="bullet-option" onclick="selectBullet(3)">3</button>
                        <button class="bullet-option" onclick="selectBullet(4)">4</button>
                        <button class="bullet-option" onclick="selectBullet(5)">5</button>
                    </div>
                    
                    <div id="mainButtons">
                        <button class="btn btn-success" onclick="setReady()">✓ 准备（扣除底注）</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentRoomId = null;
        let currentPlayerId = null;
        let isHost = false;
        let gameState = null;
        let selectedBulletCount = 1;
        let currentBet = 0;
        
        // 当前登录用户信息
        let currentUser = {
            name: '',
            coins: 200,
            debt: 0,
            canClaimWage: false,
            wageCooldown: '00:00:00'
        };

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function connectWebSocket(onOpen) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            console.log('Connecting to:', wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                onOpen();
            };
            
            ws.onmessage = (event) => {
                console.log('Received:', event.data);
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                showError('连接失败');
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed');
            };
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'loginSuccess':
                    currentUser = {
                        name: data.data.name,
                        coins: data.data.coins,
                        debt: data.data.debt,
                        canClaimWage: data.data.canClaimWage,
                        wageCooldown: data.data.wageCooldown
                    };
                    
                    if (data.data.isNew) {
                        showSuccess('注册成功！初始金币200');
                    } else {
                        showSuccess('登录成功！');
                    }
                    
                    showLobby();
                    break;
                    
                case 'roomCreated':
                    currentRoomId = data.data.roomId;
                    currentPlayerId = data.data.playerId;
                    isHost = true;
                    showGameScreen();
                    break;
                    
                case 'roomJoined':
                    currentRoomId = data.data.roomId;
                    currentPlayerId = data.data.playerId;
                    isHost = false;
                    showGameScreen();
                    break;
                    
                case 'gameState':
                    gameState = data.data;
                    const player = gameState.players.find(p => p.id === currentPlayerId);
                    if (player) {
                        isHost = player.isHost;
                        currentUser.coins = player.coins;
                        currentUser.debt = player.debt;
                        currentBet = player.currentBet || 0;
                    }
                    updateGameUI();
                    break;
                    
                case 'error':
                    showError(data.data.message);
                    break;
                    
                case 'wageClaimed':
                    currentUser.coins = data.data.coins;
                    currentUser.canClaimWage = false;
                    updateLobbyUI();
                    updateGameUI();
                    alert(data.data.message);
                    break;
                    
                case 'loanTaken':
                    currentUser.coins = data.data.coins;
                    currentUser.debt = data.data.debt;
                    updateLobbyUI();
                    updateGameUI();
                    alert(data.data.message);
                    break;
                    
                case 'betPlaced':
                    currentBet = data.data.totalBet;
                    document.getElementById('betInfo').textContent = `当前投注: ${currentBet} | 总计: ${1 + currentBet}（含底注）`;
                    break;
            }
        }

        // 登录
        function login() {
            const name = document.getElementById('loginName').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!name || !password) {
                showError('请输入昵称和密码');
                return;
            }
            
            connectWebSocket(() => {
                ws.send(JSON.stringify({
                    type: 'login',
                    playerName: name,
                    password: password
                }));
            });
        }

        // 显示大厅
        function showLobby() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'block';
            document.getElementById('gameScreen').style.display = 'none';
            updateLobbyUI();
        }

        // 更新大厅UI
        function updateLobbyUI() {
            document.getElementById('lobbyUserName').textContent = currentUser.name;
            document.getElementById('totalAssets').textContent = currentUser.coins;
            document.getElementById('lobbyCoins').textContent = currentUser.coins;
            document.getElementById('lobbyDebt').textContent = currentUser.debt;
            document.getElementById('lobbyNet').textContent = currentUser.coins - Math.floor(currentUser.debt * (13/9));
            
            const wageBtn = document.getElementById('lobbyWageBtn');
            wageBtn.disabled = !currentUser.canClaimWage;
            wageBtn.textContent = currentUser.canClaimWage ? '领工资' : `冷却 ${currentUser.wageCooldown}`;
        }

        // 创建房间
        function createRoom() {
            if (!ws) return;
            ws.send(JSON.stringify({
                type: 'createRoom',
                playerName: currentUser.name
            }));
        }

        // 加入房间
        function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
            if (!roomId) {
                showError('请输入房间号');
                return;
            }
            
            if (!ws) return;
            ws.send(JSON.stringify({
                type: 'joinRoom',
                roomId: roomId,
                playerName: currentUser.name
            }));
        }

        // 显示游戏界面
        function showGameScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('lobbyScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('roomIdDisplay').textContent = currentRoomId;
            document.getElementById('gameUserName').textContent = currentUser.name;
            updateGameUI();
        }
